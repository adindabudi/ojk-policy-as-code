name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, live job only: new major versions of the built-ins, and drift between Terraform state and Azure.
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt, validate and TFLint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: |
          for dir in terraform examples/demo-lab/terraform; do
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  bicep:
    name: Bicep build and lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI
        run: az bicep install --version v0.48.1
      - name: build and lint
        run: |
          for f in bicep/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
          done
          for f in bicep/*.bicepparam; do
            az bicep build-params --file "$f" --stdout > /dev/null
          done

  mapping:
    name: Mapping, checklist and README counts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: validate_mapping.py --offline
        run: python scripts/validate_mapping.py --offline

  # Optional. Runs only when OIDC to Azure is set up through repository variables AZURE_CLIENT_ID,
  # AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (plus TFVARS_FILE and TF_BACKEND_CONFIG for the plan). Pull requests
  # from forks never get an Azure token. The identity needs Reader on the plan scope; it doesn't need write access.
  live:
    name: Live built-in check and Terraform plan
    needs: [terraform, bicep, mapping]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: validate_mapping.py against live built-ins
        run: |
          set -o pipefail
          python scripts/validate_mapping.py | tee mapping.txt
          {
            echo '### Live built-in check'
            echo '```'
            grep -E '^(WARN|ERROR|Result)' mapping.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: vars.TFVARS_FILE != ''
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      # With backend.tf and TF_BACKEND_CONFIG (see README, Remote state), the plan compares against real state.
      # The plan identity needs Storage Blob Data Reader on the state container; -lock=false avoids a write lease.
      - name: terraform plan
        if: vars.TFVARS_FILE != ''
        working-directory: terraform
        env:
          TFVARS_FILE: ${{ vars.TFVARS_FILE }}
          TF_CLI_ARGS_init: ${{ vars.TF_BACKEND_CONFIG }}
        run: |
          set -o pipefail
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -no-color -lock=false \
            -var-file="$TFVARS_FILE" -var="subscription_id=$ARM_SUBSCRIPTION_ID" | tee plan.txt
          {
            echo '### terraform plan'
            echo '```'
            grep -E '^(  #|Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
